[project]
name = "levuvo-ai"
version = "0.1.0"
description = "Levuvo Mail AI sidecar: Orkexa agents behind a JSON-RPC interface on standard input and output."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = ["orkexa[openai,anthropic]"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["levuvo_ai"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
