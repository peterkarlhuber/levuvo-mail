name: Release
# Creates a DRAFT release (never published automatically) from a verified commit: the commit must be
# on master and its CI and CodeQL runs must have passed (job `gate`, scripts/release-gate.mjs).
# Trigger: tag vX.Y.Z (must match package.json) or manual (workflow_dispatch).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      signed:
        description: 'Signed release (requires secrets in the "release-signing" environment)'
        type: boolean
        default: false
permissions:
  contents: read
# Never two releases at the same time; running releases are not cancelled.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    name: Verify version and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$EVENT" = push ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match package.json ($tag)"; exit 1
          fi
          # Tag and manual runs (signed or not): only commits that are on the default branch.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master 2>/dev/null \
            || git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null \
            || { echo "::error::Commit $GITHUB_SHA is not on the default branch"; exit 1; }
          # Existing releases/tags are never overwritten.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the version in package.json or delete the draft deliberately."; exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tagsha=$(git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null || true)
            [ "$tagsha" = "$GITHUB_SHA" ] || { echo "::error::Tag $tag exists on a different commit"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  gate:
    name: CI and CodeQL passed for this commit
    needs: [prepare]
    runs-on: ubuntu-24.04
    # CI may still be running right after the merge: the gate waits up to 90 minutes.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Wait for successful CI and CodeQL runs of exactly this SHA (push to master)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/release-gate.mjs --repo "$REPO" --sha "$GITHUB_SHA" --branch master

  quality:
    name: Quality check
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Release checks (audit, syntax, lint, format, tests, typecheck, build)
        run: npm run release:check
      - run: node scripts/check-workflows.mjs
      - run: node scripts/secret-scan.mjs
      - name: SBOM (CycloneDX) and licence notices for the release
        run: |
          npm run check:licenses
          node scripts/sbom.mjs --commit "$GITHUB_SHA" --out "levuvo-mail-${{ needs.prepare.outputs.version }}.cdx.json"
          git diff --exit-code THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance
          path: |
            levuvo-mail-*.cdx.json
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 30

  manual:
    name: User manual (PDF, DE and EN)
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Inter font and Typst
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-inter poppler-utils
          python -m pip install --require-hashes -r scripts/manual/requirements.txt
      - run: npm ci --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Every feature and changelog entry has its manual section
        run: npm run manual:features
      - run: npm run manual:pdf
      - name: Check the PDFs (tagged, title, page count)
        run: node scripts/manual/check-pdf.mjs dist/manual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual
          path: dist/manual/*.pdf
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build
    needs: [prepare, gate, quality]
    uses: ./.github/workflows/build-desktop.yml
    with:
      signed: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
      ref: ${{ github.sha }}
      retention-days: 30
    secrets: inherit
    permissions:
      contents: read

  publish:
    name: Create draft release
    needs: [prepare, gate, quality, manual, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only this job may write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Assemble and verify the release directory
        env:
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: |
          flags=""
          [ "$SIGNED" = true ] && flags="--signed"
          node scripts/assemble-release.mjs --in artifacts --out release-assets --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $flags
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          ls -l release-assets
      - name: Create draft release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: |
          extra=""
          title="Levuvo Mail $VERSION"
          if [ "$SIGNED" != true ]; then extra="--prerelease"; title="$title (unsigned internal test build)"; fi
          # --target pins the commit; the tag is only created on publication.
          gh release create "$TAG" release-assets/* \
            --draft $extra --target "$GITHUB_SHA" --title "$title" \
            --notes-file release-assets/RELEASE_NOTES.md
          gh release view "$TAG" --json url,isDraft,assets --jq '{url,isDraft,assets:[.assets[].name]}'
