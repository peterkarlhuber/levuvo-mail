name: research-model-digest (temporary)
on:
  push:
    branches: [claude/project-thread-2yspay]
    paths: ['.github/workflows/research-model-digest.yml', 'scripts/research/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: bash scripts/research/probe2.sh
