name: research-model-digest (temporary)
on:
  push:
    branches: [claude/project-thread-2yspay]
    paths: ['.github/workflows/research-model-digest.yml', 'scripts/research/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: node scripts/research/probe-list.mjs
  pull:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        model: ['qwen3.5:4b', 'gemma4:e2b', 'ministral-3:3b', 'qwen3.5:9b', 'gemma4:12b', 'ministral-3:8b', 'qwen3.8:27b', 'mistral-small3.2:24b', 'ministral-3:14b', 'bge-m3', 'qwen3-embedding:0.6b', 'qwen3-embedding:4b']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - run: npm ci --no-fund --ignore-scripts
      - run: node scripts/fetch-ollama.mjs --arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }} --out "$RUNNER_TEMP/ollama"
      - name: Pull
        run: |
          BIN=$(find "$RUNNER_TEMP/ollama" -name ollama -type f -perm -u+x | head -1)
          bash scripts/research/pull-one.sh '${{ matrix.model }}' "$BIN"
