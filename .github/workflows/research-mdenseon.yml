name: research-mdenseon (temporary)
on:
  push:
    branches: [claude/project-thread-xzpyc3]
    paths: ['.github/workflows/research-mdenseon.yml', 'scripts/research/**']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: mDenseOn GGUF in Levuvo's pinned Ollama
        run: |
          set +e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet "transformers>=4.48" sentencepiece gguf protobuf safetensors huggingface_hub numpy
          python -c "from huggingface_hub import snapshot_download; print(snapshot_download('lightonai/mDenseOn', revision='a5fdb000f7a21da96c3bddde3a782ef777316df3', local_dir='/tmp/mdo'))"
          python /tmp/llama.cpp/convert_hf_to_gguf.py /tmp/mdo --outtype f16 --outfile /tmp/mdo.gguf 2>&1 | tail -3
          sha256sum /tmp/mdo.gguf
          v=$(python3 -c "import json; print(json.load(open('scripts/ollama/ollama-lock.json'))['version'])")
          curl -sSL -o /tmp/ollama.tar.zst "https://github.com/ollama/ollama/releases/download/v$v/ollama-linux-amd64.tar.zst"
          mkdir -p /tmp/ol && tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/ol
          /tmp/ol/bin/ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          printf 'FROM /tmp/mdo.gguf\n' > /tmp/Modelfile
          /tmp/ol/bin/ollama create mdenseon -f /tmp/Modelfile 2>&1 | tail -3
          /tmp/ol/bin/ollama pull bge-m3 2>&1 | tail -1
          node scripts/research/eval_ollama.mjs
          /tmp/ol/bin/ollama show mdenseon 2>&1 | head -20
          tail -30 /tmp/ollama.log | grep -iv "GIN" | tail -15
