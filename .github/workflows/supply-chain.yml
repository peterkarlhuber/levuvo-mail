name: Supply chain
# Weekly scan of everything that ships in the installers, independent of code changes:
# npm runtime dependencies, the hashed Python locks of the AI runtime, the bundled CPython, the
# Electron support window, the bundled Ollama and the pinned model catalog. Failures show up as a red scheduled run.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Dependencies and runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --no-fund --ignore-scripts
      - name: npm audit (runtime, blocking from moderate)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Licence policy and SBOM
        run: |
          npm run check:licenses
          node scripts/sbom.mjs --out "$RUNNER_TEMP/levuvo-mail.cdx.json"
      - name: Electron still in its support window
        run: node scripts/check-electron-support.mjs
      - name: pip-audit of the hashed Python locks
        run: |
          python -m pip install --require-hashes -r apps/ai/requirements-build.txt
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes -r apps/ai/requirements-audit.txt
          for lock in requirements-lock.txt requirements-build.txt requirements-backends.txt requirements-audit.txt requirements-dev-lock.txt; do
            "$RUNNER_TEMP/audit/bin/pip-audit" --require-hashes --disable-pip --progress-spinner off -r "apps/ai/$lock"
          done
      - name: Bundled CPython is the newest patch release
        run: node scripts/check-python-runtime.mjs --strict
      - name: Bundled Ollama has no published advisory (a newer release only warns)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ollama/check-ollama-runtime.mjs
      - name: Model catalog pins still match the registry
        run: node scripts/ollama/check-catalog.mjs
