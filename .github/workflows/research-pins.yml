name: research-pins (temporary)
on:
  push:
    branches: [claude/project-thread-2yspay]
    paths: ['.github/workflows/research-pins.yml', 'scripts/ollama/**', 'apps/server/src/ai-model-catalog.mjs']
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: node scripts/ollama/check-catalog.mjs --print
  mac-live:
    strategy:
      fail-fast: false
      matrix:
        models: ['qwen3.5:9b,gemma4:12b,ministral-3:8b', 'qwen3.8:27b,bge-m3,qwen3-embedding:0.6b', 'mistral-small3.2:24b,ministral-3:14b,qwen3-embedding:4b']
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: npm ci --no-fund --ignore-scripts
      - run: node scripts/fetch-ollama.mjs --arch arm64 --out "$RUNNER_TEMP/ollama"
      - env:
          LEVUVO_LIVE_MODELS: ${{ matrix.models }}
        run: |
          export LEVUVO_OLLAMA_BIN="$(find "$RUNNER_TEMP/ollama" -name ollama -type f -perm -u+x | head -1)"
          node --test test/ollama-live/*.test.mjs
