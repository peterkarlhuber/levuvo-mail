name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
# Default: read-only. No job in this file needs write permissions.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Quality (syntax, lint, format, tests, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: package-lock.json consistent with package.json
        run: npm ls --all --package-lock-only > /dev/null
      - name: Workflow policy (permissions, SHA pins)
        run: node scripts/check-workflows.mjs
      - run: npm run check:syntax
      - run: npm run lint
      - run: npm run format:check
      - name: Tests (server, UI, desktop configuration, i18n)
        run: npm test
      - name: Large mailbox benchmark (100k synthetic messages, upper bounds)
        run: npm run bench:mailbox
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium for the accessibility test
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe-core WCAG 2.2 AA, keyboard, phone layout)
        run: npm run test:a11y
      - name: License notices up to date
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt

  security:
    name: Security (audit, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --ignore-scripts
      - name: Runtime audit (everything that runs in the app) – required, blocking from high
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit incl. build tools – blocking from high, rest in the summary
        run: |
          set +e
          npm audit --audit-level=high
          rc=$?
          {
            echo '### npm audit (all dependencies, incl. dev/build)'
            echo '```'
            npm audit 2>&1 | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Secret scan (tracked files)
        run: node scripts/secret-scan.mjs
      - name: No local mail data / profiles tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(accounts\.json|\.env(\..*)?|.*\.(pfx|pem|keychain))$'; then
            echo '::error::Local account data / credentials are tracked in git'; exit 1
          fi

  ai:
    name: AI sidecar (Python lint and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Tested with exactly what the installers ship (OPS-LEV-007): third-party packages from the
      # hashed lock, Tabrion/Orkexa from their commit pins without resolving anything again, test
      # tools (and pip) from their own hashed lock.
      - name: Install (hashed locks, pinned commits)
        run: |
          python -m pip install --require-hashes -r apps/ai/requirements-dev-lock.txt
          python -m pip install --require-hashes -r apps/ai/requirements-lock.txt
          python -m pip install --no-deps -r apps/ai/requirements.txt
          python -m pip check
      - name: Lint and format
        working-directory: apps/ai
        run: ruff check . && ruff format --check .
      - name: Tests
        working-directory: apps/ai
        run: python -m pytest -q
      - name: Bundled runtime (hashed lock, git pins, smoke test)
        run: |
          python -m pip install --require-hashes -r apps/ai/requirements-build.txt
          node scripts/build-ai-runtime.mjs --out "$RUNNER_TEMP/ai-runtime"
      - name: Vulnerability scan of the hashed Python locks (pip-audit, blocking)
        run: |
          # Own environment, so the scanner's dependencies never mix with the tested ones.
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes -r apps/ai/requirements-audit.txt
          for lock in requirements-lock.txt requirements-build.txt requirements-backends.txt requirements-audit.txt requirements-dev-lock.txt; do
            echo "::group::pip-audit $lock"
            "$RUNNER_TEMP/audit/bin/pip-audit" --require-hashes --disable-pip --progress-spinner off -r "apps/ai/$lock"
            echo '::endgroup::'
          done
      - name: Bundled CPython is the newest patch release (warning)
        run: node scripts/check-python-runtime.mjs

  electron-node:
    name: Tests in the Node of Electron (production runtime)
    # The server runs inside Electron's main process, whose Node differs from the setup-node line.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (exact lockfile, with the Electron binary)
        # npm ci on the runner does not leave the Electron binary in place; its own installer fetches and checks it.
        run: |
          npm ci --no-fund
          node node_modules/electron/install.js
      - name: npm test with ELECTRON_RUN_AS_NODE
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          node_modules/electron/dist/electron -p "'Electron ' + process.versions.electron + ', Node ' + process.version"
          node_modules/electron/dist/electron --test apps/server/test/*.test.mjs apps/web/test/*.test.mjs

  desktop-build:
    name: Desktop build (unsigned)
    needs: [check]
    uses: ./.github/workflows/build-desktop.yml
    with:
      signed: false
      ref: ${{ github.sha }}
      retention-days: 7
    permissions:
      contents: read

  ci-ok:
    name: CI passed
    if: ${{ always() }}
    needs: [check, security, ai, electron-node, desktop-build]
    runs-on: ubuntu-24.04
    steps:
      - name: All required checks successful?
        run: |
          echo '${{ toJSON(needs) }}' | node -e "
            const n = JSON.parse(require('fs').readFileSync(0,'utf8'));
            const bad = Object.entries(n).filter(([,v]) => v.result !== 'success');
            for (const [k,v] of Object.entries(n)) console.log(k, v.result);
            if (bad.length) process.exit(1);"
