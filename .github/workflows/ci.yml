name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
# Standard: nur lesen. Kein Job in dieser Datei benötigt Schreibrechte.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Qualität (Syntax, Lint, Format, Tests, Typecheck, Build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: package-lock.json konsistent mit package.json
        run: npm ls --all --package-lock-only > /dev/null
      - name: Workflow-Richtlinien (Berechtigungen, SHA-Pins)
        run: node scripts/check-workflows.mjs
      - run: npm run check:syntax
      - run: npm run lint
      - run: npm run format:check
      - name: Tests (Server, Oberfläche, Desktop-Konfiguration, i18n)
        run: npm test
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run build
      - name: Lizenzhinweise aktuell
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt

  security:
    name: Sicherheit (Audit, Secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --ignore-scripts
      - name: Runtime-Audit (alles, was in der App läuft) – Pflicht, ab high blockierend
        run: npm audit --omit=dev --audit-level=high
      - name: Vollständiger Audit inkl. Build-Werkzeuge – ab high blockierend, Rest im Summary
        run: |
          set +e
          npm audit --audit-level=high
          rc=$?
          {
            echo '### npm audit (alle Abhängigkeiten, inkl. dev/build)'
            echo '```'
            npm audit 2>&1 | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Secret-Scan (versionierte Dateien)
        run: node scripts/secret-scan.mjs
      - name: Keine lokalen Maildaten / Profile versioniert
        run: |
          if git ls-files | grep -Ei '(^|/)(accounts\.json|\.env(\..*)?|.*\.(pfx|pem|keychain))$'; then
            echo '::error::Lokale Konto-/Zugangsdaten sind versioniert'; exit 1
          fi

  desktop-build:
    name: Desktop-Build (unsigniert)
    needs: [check]
    uses: ./.github/workflows/build-desktop.yml
    with:
      signed: false
      ref: ${{ github.sha }}
      retention-days: 7
    permissions:
      contents: read

  ci-ok:
    name: CI bestanden
    if: ${{ always() }}
    needs: [check, security, desktop-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Alle Pflichtprüfungen erfolgreich?
        run: |
          echo '${{ toJSON(needs) }}' | node -e "
            const n = JSON.parse(require('fs').readFileSync(0,'utf8'));
            const bad = Object.entries(n).filter(([,v]) => v.result !== 'success');
            for (const [k,v] of Object.entries(n)) console.log(k, v.result);
            if (bad.length) process.exit(1);"
