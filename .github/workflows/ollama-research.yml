name: Ollama research (temporary)
on:
  push:
    branches: [claude/project-thread-r10vyl]
    paths: ['apps/server/src/ai-model-catalog.mjs', 'scripts/ollama/**', '.github/workflows/ollama-research.yml']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: windows-11-arm, arch: arm64 }
          - { runner: windows-2022, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - run: node scripts/fetch-ollama.mjs --arch ${{ matrix.arch }} --inspect
      - shell: bash
        run: cat build/ollama-runtime/ollama-runtime.json
