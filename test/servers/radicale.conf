# Radicale for the integration tests: two users (htpasswd, plain throwaway passwords), each sees only its own collections.
[server]
hosts = 0.0.0.0:5232

[auth]
type = htpasswd
htpasswd_filename = /config/users
htpasswd_encryption = plain

[rights]
type = owner_only

[storage]
filesystem_folder = /data/collections
